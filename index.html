.lp *{box-sizing:border-box}
.lp-in{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
.lp-av{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid rgba(242,242,238,0.25);display:flex;align-items:center;justify-content:center;background:#f2f2ee;color:#15171c;font-size:38px;font-weight:700}
.lp-name{font-size:24px;font-weight:700;margin:18px 0 4px;text-align:center;letter-spacing:-.01em;text-wrap:balance}
.lp-bio{margin:0 0 30px;text-align:center;opacity:.82;max-width:36ch;white-space:pre-line}
.lp-links{width:100%;display:grid;gap:14px;list-style:none;margin:0;padding:0}
.lp-a{display:block;text-align:center;padding:16px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:16px;overflow-wrap:anywhere;transition:transform .15s ease,box-shadow .15s ease;background:#f2f2ee;color:#15171c;border:2px solid #f2f2ee;}
.lp-a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.lp-a:focus-visible{outline:3px solid #f2f2ee;outline-offset:3px}
.lp-empty{opacity:.6;text-align:center;font-size:14px}
@media (prefers-reduced-motion:reduce){.lp-a{transition:none}.lp-a:hover{transform:none}}</style>
